server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Provider requests may take longer than authentication/admin requests.
  location ^~ /api/ {
    proxy_read_timeout 120s;
    proxy_pass http://backend:8000;
  }

  # Preserve the redirects supplied by the former prefix locations.
  location = /auth { return 301 /auth/$is_args$args; }
  location = /admin { return 301 /admin/$is_args$args; }
  location ~ ^/(auth|admin)/ {
    proxy_pass http://backend:8000;
  }

  # Approval/consent must be reviewed in a top-level, trusted app window.
  location = /connections/authorize {
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
