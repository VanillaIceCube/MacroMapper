# Standalone local HTTPS only; Infrastructure owns production ingress.
name: macromapper

services:
  proxy:
    image: nginx:alpine
    container_name: macromapper-proxy
    environment:
      LOCAL_SERVER_NAME: macromapper.localhost localhost
      LOCAL_HTTPS_ORIGIN: ${MACROMAPPER_HTTPS_ORIGIN:-https://macromapper.localhost}
      NGINX_ENVSUBST_FILTER: ^LOCAL_(SERVER_NAME|HTTPS_ORIGIN)$$
    volumes:
      - type: bind
        source: ./nginx-proxy.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MACROMAPPER_CERTS_DIR:-../certs}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${MACROMAPPER_HTTP_PORT:-80}:80"
      - "127.0.0.1:${MACROMAPPER_HTTPS_PORT:-443}:443"
    restart: always
    depends_on:
      - frontend
      - backend
    networks:
      default:
      backend_private:
        ipv4_address: 172.30.89.2

  backend:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    image: ghcr.io/vanillaicecube/macromapper-backend:latest
    container_name: macromapper-backend
    volumes:
      # Requires an existing file; follow missing-only setup in deploy/README.md.
      - type: bind
        source: ./db.sqlite3
        target: /backend/db.sqlite3
        bind:
          create_host_path: false
    env_file: .env
    environment:
      DJANGO_SQLITE_PATH: /backend/db.sqlite3
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,macromapper.localhost
      DJANGO_CORS_ALLOWED_ORIGINS: ${MACROMAPPER_HTTPS_ORIGIN:-https://macromapper.localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${MACROMAPPER_HTTPS_ORIGIN:-https://macromapper.localhost}
      DJANGO_FRONTEND_BASE_URL: ${MACROMAPPER_HTTPS_ORIGIN:-https://macromapper.localhost}
      DJANGO_MCP_BASE_URL: ${MACROMAPPER_HTTPS_ORIGIN:-https://macromapper.localhost}
      DJANGO_TRUSTED_PROXY_IPS: 172.30.89.2
    networks:
      backend_private:
        ipv4_address: 172.30.89.3
      backend_egress:
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_MCP_ENABLED: ${DJANGO_MCP_ENABLED:-0}
    image: ghcr.io/vanillaicecube/macromapper-frontend:latest
    container_name: macromapper-frontend
    restart: always
    depends_on:
      - backend

networks:
  backend_private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.89.0/29
  # SMTP and other outbound backend traffic retain Internet access.
  backend_egress:
