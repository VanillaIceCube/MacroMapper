# Additional vhost on the existing Notoli public proxy. No new listener ports.
server {
  listen 80;
  listen [::]:80;
  server_name macromapper.judeandrewalaba.com;
  return 301 https://macromapper.judeandrewalaba.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name macromapper.judeandrewalaba.com;
  ssl_certificate /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  client_max_body_size 25m;

  # Variables defer lookup so Notoli can start while MacroMapper is absent.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $macromapper_backend macromapper-backend:8000;
  set $macromapper_frontend macromapper-frontend:80;
  proxy_redirect off;
  proxy_set_header Host macromapper.judeandrewalaba.com;
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  location = /api { return 301 /api/; }
  location = /auth { return 301 /auth/; }
  location = /admin { return 301 /admin/; }
  location ~ ^/(auth|api|admin)/ {
    proxy_pass http://$macromapper_backend$request_uri;
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/static/(admin|rest_framework)/ {
    proxy_pass http://$macromapper_backend$request_uri;
  }

  location / {
    proxy_pass http://$macromapper_frontend$request_uri;
  }
}
