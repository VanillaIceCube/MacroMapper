name: Deploy

on:
  push:
    branches:
      - env-prod
  workflow_dispatch:

concurrency:
  group: macromapper-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/env-prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate access and stage production bundle
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
          DJANGO_CORS_ALLOWED_ORIGINS: ${{ vars.DJANGO_CORS_ALLOWED_ORIGINS }}
          DJANGO_CSRF_TRUSTED_ORIGINS: ${{ vars.DJANGO_CSRF_TRUSTED_ORIGINS }}
          DJANGO_FORCE_SCRIPT_NAME: ${{ vars.DJANGO_FORCE_SCRIPT_NAME }}
          DJANGO_FRONTEND_BASE_URL: ${{ vars.DJANGO_FRONTEND_BASE_URL }}
          DJANGO_EMAIL_BACKEND: ${{ vars.DJANGO_EMAIL_BACKEND }}
          DJANGO_EMAIL_HOST: ${{ vars.DJANGO_EMAIL_HOST }}
          DJANGO_EMAIL_PORT: ${{ vars.DJANGO_EMAIL_PORT }}
          DJANGO_EMAIL_USE_TLS: ${{ vars.DJANGO_EMAIL_USE_TLS }}
          DJANGO_EMAIL_HOST_USER: ${{ vars.DJANGO_EMAIL_HOST_USER }}
          DJANGO_EMAIL_HOST_KEY: ${{ secrets.DJANGO_EMAIL_HOST_KEY }}
          DJANGO_EMAIL_TIMEOUT: ${{ vars.DJANGO_EMAIL_TIMEOUT }}
          DJANGO_DEFAULT_FROM_EMAIL: ${{ vars.DJANGO_DEFAULT_FROM_EMAIL }}
          MACROMAPPER_OPENAI_API_KEY: ${{ secrets.MACROMAPPER_OPENAI_API_KEY }}
          OPENAI_MEAL_ESTIMATION_MODEL: ${{ vars.OPENAI_MEAL_ESTIMATION_MODEL }}
          OPENAI_MEAL_ESTIMATION_TIMEOUT: ${{ vars.OPENAI_MEAL_ESTIMATION_TIMEOUT }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          missing = [key for key in ('DEPLOY_HOST', 'DEPLOY_USER', 'DEPLOY_PATH', 'DEPLOY_SSH_KEY') if not os.getenv(key)]
          if missing:
              sys.exit('Missing deployment access: ' + ', '.join(missing))
          path = os.environ['DEPLOY_PATH']
          if not re.fullmatch(r'/[A-Za-z0-9_/-]+', path) or '..' in path.split('/') or path == '/':
              sys.exit('DEPLOY_PATH must be an absolute application directory with no shell characters.')
          port = os.getenv('DEPLOY_PORT') or '22'
          if not port.isdigit() or not 1 <= int(port) <= 65535:
              sys.exit('DEPLOY_PORT must be a valid SSH port.')
          PY
          umask 077
          python3 scripts/prepare-production-bundle.py deploy_bundle

      - name: Set image names
        id: image_names
        shell: bash
        run: |
          {
            echo "owner_lower=${GITHUB_REPOSITORY_OWNER,,}"
            echo "backend_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/macromapper-backend"
            echo "frontend_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/macromapper-frontend"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image_names.outputs.backend_image }}:latest
            ${{ steps.image_names.outputs.backend_image }}:sha-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ steps.image_names.outputs.frontend_image }}:latest
            ${{ steps.image_names.outputs.frontend_image }}:sha-${{ github.sha }}

      - name: Resolve deploy settings
        id: deploy_vars
        shell: bash
        env:
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          if [ -z "$DEPLOY_PORT" ]; then
            DEPLOY_PORT=22
          fi
          echo "deploy_port=$DEPLOY_PORT" >> "$GITHUB_OUTPUT"

      - name: Prepare private application directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.deploy_vars.outputs.deploy_port }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            umask 077
            test ! -L "$DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH"
            chmod 700 "$DEPLOY_PATH"

      - name: Upload reviewed configuration and private environment
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.deploy_vars.outputs.deploy_port }}
          source: "deploy_bundle/docker-compose.yml,deploy_bundle/docker-compose.shared.yml,deploy_bundle/nginx-shared.conf,deploy_bundle/deploy-production.sh,deploy_bundle/.env.next,deploy_bundle/.backend.env.next"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Deploy MacroMapper services via shared ingress
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.deploy_vars.outputs.deploy_port }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            bash deploy-production.sh
